<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mood Journal with AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23570df8'%3E%3Cpath d='M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z'/%3E%3C/svg%3E" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  .mood-btn { transition: transform .15s, box-shadow .15s; }
  .mood-btn:hover { transform: translateY(-2px); }
  .mood-btn.active { transform: scale(1.08); }
  .entry-card { transition: all .2s; }
</style>
</head>
<body class="min-h-screen bg-base-200 transition-colors">

<!-- Navbar -->
<div class="navbar bg-base-100 shadow-sm sticky top-0 z-20">
  <div class="flex-1 gap-2 px-4">
    <i data-lucide="heart" class="w-6 h-6 text-primary"></i>
    <span class="text-lg font-semibold">Mood Journal</span>
  </div>
  <div class="flex-none px-4">
    <label class="swap swap-rotate btn btn-ghost btn-circle">
      <input id="themeToggle" type="checkbox" />
      <i data-lucide="sun" class="swap-off w-5 h-5"></i>
      <i data-lucide="moon" class="swap-on w-5 h-5"></i>
    </label>
  </div>
</div>

<main class="max-w-4xl mx-auto p-4 md:p-8 space-y-6">

  <!-- Today's entry -->
  <section class="card bg-base-100 shadow-md">
    <div class="card-body">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <div>
          <h2 class="card-title text-lg">
            <i data-lucide="calendar-days" class="w-5 h-5 text-primary"></i>
            <span id="todayLabel">Today</span>
          </h2>
          <p id="todayDate" class="text-sm opacity-60 mt-0.5"></p>
        </div>
        <button id="newPromptBtn" class="btn btn-ghost btn-sm gap-2">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i> New prompt
        </button>
      </div>

      <!-- Daily prompt -->
      <div class="alert alert-info mt-4 flex items-start gap-2">
        <i data-lucide="sparkles" class="w-5 h-5 mt-0.5 flex-shrink-0"></i>
        <p id="promptText" class="text-sm italic"></p>
      </div>

      <!-- Mood selector -->
      <div class="mt-4">
        <p class="text-sm font-medium mb-2">How are you feeling?</p>
        <div id="moodSelector" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- Journal text -->
      <textarea id="journalText" rows="4" placeholder="Write your thoughts..."
                class="textarea textarea-bordered mt-3"></textarea>

      <!-- AI Reflection Box -->
      <div id="aiBox" class="hidden mt-3 p-4 bg-primary/10 rounded-box border border-primary/20">
        <div class="flex items-center gap-2 text-primary font-semibold text-sm mb-1">
          <i data-lucide="sparkles" class="w-4 h-4"></i> Gemini AI Reflection
        </div>
        <p id="aiReflectionText" class="text-sm italic opacity-90"></p>
      </div>

      <div class="card-actions justify-between items-center mt-3">
        <button id="aiReflectBtn" class="btn btn-outline btn-primary btn-sm gap-2">
          <i data-lucide="sparkles" class="w-4 h-4"></i> Get AI Reflection
        </button>
        <button id="saveBtn" class="btn btn-primary gap-2">
          <i data-lucide="save" class="w-4 h-4"></i> Save entry
        </button>
      </div>
    </div>
  </section>

  <!-- Past entries -->
  <section>
    <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
      <h2 class="text-lg font-semibold flex items-center gap-2">
        <i data-lucide="history" class="w-5 h-5 text-primary"></i> Past entries
      </h2>
      <div id="filterBar" class="flex flex-wrap gap-1"></div>
    </div>
    <div id="entriesList" class="grid gap-3"></div>
    <div id="emptyState" class="hidden text-center py-12">
      <i data-lucide="book-open" class="w-12 h-12 mx-auto opacity-40 mb-2"></i>
      <p class="opacity-60">No entries yet. Start by writing today's thoughts.</p>
    </div>
  </section>
</main>

<script>
/* ---------- Moods ---------- */
const MOODS = [
  { key: 'great',  emoji: '😄', label: 'Great',  color: 'success' },
  { key: 'good',   emoji: '🙂', label: 'Good',   color: 'primary' },
  { key: 'okay',   emoji: '😐', label: 'Okay',   color: 'neutral' },
  { key: 'low',    emoji: '😔', label: 'Low',    color: 'warning' },
  { key: 'bad',    emoji: '😢', label: 'Bad',    color: 'error' },
];
const moodMap = Object.fromEntries(MOODS.map(m => [m.key, m]));

/* ---------- Prompts ---------- */
const PROMPTS = [
  "What made you smile today?",
  "What's one thing you're grateful for right now?",
  "What's been on your mind lately?",
  "Describe your energy level in three words.",
  "What's a small win you had today?",
  "What would make tomorrow better?",
  "Who had a positive impact on your day?",
  "What's something you're looking forward to?",
];

/* ---------- Date helpers ---------- */
const todayStr = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => new Date(d + 'T00:00:00').toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });

function dailyPrompt(seed = todayStr()) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) | 0;
  return PROMPTS[Math.abs(h) % PROMPTS.length];
}
function randomPrompt() { return PROMPTS[Math.floor(Math.random() * PROMPTS.length)]; }

/* ---------- IndexedDB ---------- */
const DB_NAME = 'MoodJournalDB';
let db, entries = [], currentMood = null, currentPrompt = '';

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('entries')) {
        const s = d.createObjectStore('entries', { keyPath: 'id', autoIncrement: true });
        s.createIndex('date', 'date', { unique: true });
      }
    };
    r.onsuccess = e => { db = e.target.result; res(); };
    r.onerror = e => rej(e.target.error);
  });
}
const tx = (mode='readonly') => db.transaction('entries', mode).objectStore('entries');
const all = () => new Promise(r => { const q = tx().getAll(); q.onsuccess = () => r(q.result); });
const addEntry = e => new Promise(r => { const q = tx('readwrite').add(e); q.onsuccess = () => r(q.result); });
const putEntry = e => new Promise(r => { const q = tx('readwrite').put(e); q.onsuccess = () => r(q.result); });
const delEntry = id => new Promise(r => { const q = tx('readwrite').delete(id); q.onsuccess = () => r(); });
const getByDate = date => new Promise(r => { const q = tx().index('date').get(date); q.onsuccess = () => r(q.result); });

/* ---------- Render ---------- */
function renderMoodSelector() {
  document.getElementById('moodSelector').innerHTML = MOODS.map(m => `
    <button class="mood-btn btn btn-sm gap-2 ${currentMood === m.key ? `btn-${m.color} active` : 'btn-outline'}"
            data-mood="${m.key}">
      <span class="text-lg">${m.emoji}</span> ${m.label}
    </button>
  `).join('');
}

function renderFilterBar() {
  const counts = { all: entries.length };
  entries.forEach(e => counts[e.mood] = (counts[e.mood] || 0) + 1);
  const buttons = [`<button class="btn btn-xs filter-btn" data-filter="all">All (${counts.all})</button>`];
  MOODS.forEach(m => {
    if (counts[m.key]) buttons.push(`<button class="btn btn-xs btn-${m.color} filter-btn" data-filter="${m.key}">${m.emoji} ${counts[m.key]}</button>`);
  });
  document.getElementById('filterBar').innerHTML = buttons.join('');
  updateFilterActive();
}

let currentFilter = 'all';
function updateFilterActive() {
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('btn-active', b.dataset.filter === currentFilter);
  });
}

function renderEntries() {
  const list = document.getElementById('entriesList');
  const empty = document.getElementById('emptyState');
  const filtered = entries
    .filter(e => currentFilter === 'all' || e.mood === currentFilter)
    .sort((a, b) => b.date.localeCompare(a.date));

  if (!filtered.length) { list.innerHTML = ''; empty.classList.remove('hidden'); lucide.createIcons(); return; }
  empty.classList.add('hidden');

  list.innerHTML = filtered.map(e => {
    const m = moodMap[e.mood] || MOODS[2];
    return `
    <div class="entry-card card bg-base-100 shadow-sm">
      <div class="card-body p-4">
        <div class="flex items-start justify-between gap-3">
          <div class="flex items-center gap-3 min-w-0">
            <div class="text-3xl">${m.emoji}</div>
            <div class="min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-medium">${fmtDate(e.date)}</span>
                <span class="badge badge-${m.color} badge-sm">${m.label}</span>
              </div>
              ${e.prompt ? `<p class="text-xs opacity-60 italic mt-0.5">"${escapeHtml(e.prompt)}"</p>` : ''}
            </div>
          </div>
          <button class="btn btn-ghost btn-sm btn-circle text-error/70 hover:text-error" onclick="deleteEntry(${e.id})" title="Delete">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
        ${e.text ? `<p class="text-sm mt-2 whitespace-pre-wrap">${escapeHtml(e.text)}</p>` : `<p class="text-sm opacity-50 italic mt-2">No notes.</p>`}
        ${e.aiReflection ? `<div class="mt-3 p-3 bg-primary/10 rounded-lg text-xs italic"><span class="font-semibold not-italic">AI:</span> ${escapeHtml(e.aiReflection)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
  lucide.createIcons();
}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- Load today's entry ---------- */
async function loadToday() {
  const today = todayStr();
  document.getElementById('todayDate').textContent = fmtDate(today);
  const existing = await getByDate(today);
  const aiBox = document.getElementById('aiBox');
  
  if (existing) {
    currentMood = existing.mood;
    currentPrompt = existing.prompt || dailyPrompt();
    document.getElementById('journalText').value = existing.text || '';
    if (existing.aiReflection) {
      document.getElementById('aiReflectionText').textContent = existing.aiReflection;
      aiBox.classList.remove('hidden');
    } else {
      aiBox.classList.add('hidden');
    }
  } else {
    currentMood = null;
    currentPrompt = dailyPrompt();
    document.getElementById('journalText').value = '';
    aiBox.classList.add('hidden');
  }
  document.getElementById('promptText').textContent = currentPrompt;
  renderMoodSelector();
}

/* ---------- AI Reflection Action ---------- */
document.getElementById('aiReflectBtn').addEventListener('click', async () => {
  if (!currentMood) { alert('Please select your mood first.'); return; }
  const text = document.getElementById('journalText').value.trim();
  const btn = document.getElementById('aiReflectBtn');
  
  btn.classList.add('btn-disabled');
  btn.innerHTML = `<span class="loading loading-spinner loading-xs"></span> Thinking...`;

  try {
    const res = await fetch('/api/journal', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mood: currentMood, text, prompt: currentPrompt })
    });
    
    if (!res.ok) throw new Error('AI request failed');
    const data = await res.json();
    
    if (data.reflection) {
      document.getElementById('aiReflectionText').textContent = data.reflection;
      document.getElementById('aiBox').classList.remove('hidden');
    }
  } catch (err) {
    alert('Could not generate AI reflection at the moment.');
  } finally {
    btn.classList.remove('btn-disabled');
    btn.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4"></i> Get AI Reflection`;
    lucide.createIcons();
  }
});

/* ---------- Actions ---------- */
document.getElementById('moodSelector').addEventListener('click', e => {
  const btn = e.target.closest('[data-mood]');
  if (!btn) return;
  currentMood = btn.dataset.mood;
  renderMoodSelector();
});

document.getElementById('newPromptBtn').addEventListener('click', () => {
  currentPrompt = randomPrompt();
  document.getElementById('promptText').textContent = currentPrompt;
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  if (!currentMood) { alert('Please select a mood first.'); return; }
  const text = document.getElementById('journalText').value.trim();
  const aiReflection = document.getElementById('aiReflectionText').textContent;
  const date = todayStr();
  const existing = await getByDate(date);
  
  const entry = { 
    date, 
    mood: currentMood, 
    text, 
    prompt: currentPrompt, 
    aiReflection: document.getElementById('aiBox').classList.contains('hidden') ? null : aiReflection,
    createdAt: Date.now() 
  };
  
  if (existing) { entry.id = existing.id; await putEntry(entry); }
  else { await addEntry(entry); }
  
  entries = await all();
  renderFilterBar();
  renderEntries();

  const btn = document.getElementById('saveBtn');
  const orig = btn.innerHTML;
  btn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Saved!';
  btn.classList.remove('btn-primary'); btn.classList.add('btn-success');
  lucide.createIcons();
  setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('btn-success'); btn.classList.add('btn-primary'); lucide.createIcons(); }, 1200);
});

window.deleteEntry = async id => {
  if (!confirm('Delete this entry?')) return;
  await delEntry(id);
  entries = await all();
  renderFilterBar();
  renderEntries();
  if (entries.find(e => e.date === todayStr()) === undefined) loadToday();
};

document.getElementById('filterBar').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  currentFilter = btn.dataset.filter;
  updateFilterActive();
  renderEntries();
});

/* ---------- Theme ---------- */
document.getElementById('themeToggle').addEventListener('change', e => {
  document.documentElement.dataset.theme = e.target.checked ? 'dark' : 'light';
});

/* ---------- Init ---------- */
(async () => {
  await openDB();
  entries = await all();
  await loadToday();
  renderFilterBar();
  renderEntries();
})();
</script>
</body>
</html>
